[build]
 command = "npm run build"
 publish = "dist"
[build.environment]
 NODE_VERSION = "24"
[functions]
 directory = "netlify/functions"
 node_bundler = "esbuild"
 external_node_modules = ["sharp"]
[[redirects]]
 from = "/*"
 to = "/index.html"
 status = 200
[[headers]]
 for = "/*"
 [headers.values]
 X-Frame-Options = "DENY"
 X-Content-Type-Options = "nosniff"
 Referrer-Policy = "no-referrer"
 Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'"

